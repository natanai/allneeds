<!doctype html>
<html lang="en" data-app-state="loading">
  <head>
    <meta charset="UTF-8" />
    <script>window.__ALLNEEDS_BOOT_STARTED_MS__ = performance.now();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Build an inventory of strategies to tend to all your basic human needs. Everything stays on your device."
    />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icons/favicon-color.svg" />
    <link rel="manifest" href="%BASE_URL%site.webmanifest" />
    <script>
      (function preapplySavedTheme() {
        var key = 'nvcApp.theme';
        var variables = {
          primary: '--primary', quiet: '--quiet', text: '--text', secondary: '--secondary',
          action: '--action', positive: '--positive', attention: '--attention', selection: '--selection', outline: '--outline'
        };
        /* Accept old saved hue-keyed themes only while migrating persisted user data. */
        var legacy = {
          primary: 'plum', quiet: 'lavender', text: 'ink', secondary: 'inkSoft',
          action: 'rose', positive: 'mint', attention: 'gold', selection: 'sky', outline: 'outline'
        };
        var hexPattern = /^#(?:[0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/;
        var root = document.documentElement;

        function parse(storage) {
          try {
            var raw = storage && storage.getItem(key);
            var value = raw ? JSON.parse(raw) : null;
            return value && typeof value === 'object' && !Array.isArray(value) ? value : null;
          } catch (error) { return null; }
        }

        function timestamp(value) {
          return value && typeof value.updatedAt === 'number' && Number.isFinite(value.updatedAt)
            ? value.updatedAt
            : 0;
        }

        function color(value) {
          if (typeof value !== 'string') return '';
          var prefixed = value.trim().charAt(0) === '#' ? value.trim() : '#' + value.trim();
          return hexPattern.test(prefixed) ? prefixed.toUpperCase() : '';
        }

        function stored(name) {
          try { return parse(window[name]); } catch (error) { return null; }
        }

        var local = stored('localStorage');
        var session = stored('sessionStorage');
        var theme = session && (!local || timestamp(session) > timestamp(local)) ? session : local;
        if (!theme || !theme.values || typeof theme.values !== 'object') return;

        var applied = false;
        var resolved = {};
        Object.keys(variables).forEach(function (name) {
          var value = color(theme.values[name]) || color(theme.values[legacy[name]]);
          if (!value) return;
          resolved[name] = value;
          root.style.setProperty(variables[name], value);
          applied = true;
        });
        var roundness = typeof theme.roundness === 'number' ? theme.roundness : Number(theme.roundness);
        if (Number.isFinite(roundness)) {
          root.style.setProperty('--corner-scale', String(Math.min(200, Math.max(0, Math.round(roundness))) / 100));
          applied = true;
        }
        var quiet = resolved.quiet;
        var action = resolved.action;
        var outline = resolved.outline;
        var selection = resolved.selection;
        var surface = quiet ? 'color-mix(in srgb, ' + quiet + ' 12%, #FFFFFF 88%)' : '';
        if (surface) root.style.setProperty('--surface-raised', surface);
        if (action) root.style.setProperty('--btn-bg', action);
        if (outline) root.style.setProperty('--shadow', 'color-mix(in srgb, ' + outline + ' 55%, transparent)');
        if (surface && selection) root.style.setProperty('--chip-bg', 'color-mix(in srgb, ' + surface + ' 86%, ' + selection + ' 14%)');
        if (applied) root.setAttribute('data-theme-preapplied', 'true');
      })();
    </script>
    <style>
      html[data-app-state='loading'] #root {
        visibility: hidden;
      }
      .app-boot {
        position: fixed;
        z-index: 10000;
        inset: 0;
        display: grid;
        place-items: center;
        box-sizing: border-box;
        padding:
          max(1.5rem, env(safe-area-inset-top))
          max(1.25rem, env(safe-area-inset-right))
          max(1.5rem, env(safe-area-inset-bottom))
          max(1.25rem, env(safe-area-inset-left));
        overflow: hidden;
        background:
          radial-gradient(
            circle at 50% 28%,
            color-mix(in srgb, var(--surface-raised, #ffffff) 42%, transparent) 0,
            transparent 42%
          ),
          linear-gradient(
            155deg,
            color-mix(in srgb, var(--quiet, #ede4ff) 88%, #ffffff 12%) 0%,
            color-mix(in srgb, var(--primary, #74569b) 46%, var(--quiet, #ede4ff) 54%) 100%
          );
        color: var(--text, #12081f);
        opacity: 1;
        visibility: visible;
        transition: opacity 180ms ease, visibility 0s linear 180ms;
      }
      html[data-app-state='ready'] .app-boot {
        pointer-events: none;
        opacity: 0;
        visibility: hidden;
      }
      .app-boot__card {
        box-sizing: border-box;
        width: min(25rem, calc(100vw - 2.5rem));
        padding: 1.55rem 1.45rem 1.4rem;
        border: 3px solid var(--outline, #12081f);
        border-radius: calc(1.65rem * var(--corner-scale, 1));
        background: color-mix(in srgb, var(--quiet, #ede4ff) 18%, var(--surface-raised, #ffffff) 82%);
        box-shadow: 0 12px 0 color-mix(in srgb, var(--outline, #12081f) 25%, transparent);
        text-align: center;
      }
      .app-boot strong {
        display: block;
        margin-bottom: 1rem;
        font: 750 1.25rem/1.15 Manrope, 'Segoe UI', sans-serif;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }
      .app-boot__track {
        height: 0.78rem;
        overflow: hidden;
        border: 2px solid var(--outline, #12081f);
        border-radius: 999px;
        background: color-mix(in srgb, var(--quiet, #ece4ff) 76%, #ffffff 24%);
      }
      .app-boot__bar {
        width: 38%;
        height: 100%;
        border-radius: inherit;
        background: color-mix(in srgb, var(--primary, #74569b) 78%, var(--surface-raised, #ffffff) 22%);
        animation: app-boot-progress 1.05s ease-in-out infinite alternate;
      }
      .app-boot__label {
        display: block;
        margin-top: 0.9rem;
        color: var(--secondary, #51445f);
        font: 600 0.9rem/1.35 'Atkinson Hyperlegible', 'Segoe UI', sans-serif;
      }
      @keyframes app-boot-progress {
        from { transform: translateX(-20%); }
        to { transform: translateX(184%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-boot { transition: none; }
        .app-boot__bar { width: 100%; animation: none; }
      }
    </style>
    <title>allneeds.app</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- The splash owns the visual loading state while React mounts and measures beneath it. -->
    <div id="app-boot" class="app-boot" role="status" aria-live="polite">
      <div class="app-boot__card">
        <strong>allneeds.app</strong>
        <div class="app-boot__track" aria-hidden="true"><div class="app-boot__bar"></div></div>
        <span class="app-boot__label">Getting everything ready…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
