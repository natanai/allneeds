<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>window.__ALLNEEDS_BOOT_STARTED_MS__ = performance.now();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Build an inventory of strategies to tend to all your basic human needs. Everything stays on your device."
    />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icons/favicon-color.svg" />
    <link rel="manifest" href="%BASE_URL%site.webmanifest" />
    <script>
      (function preapplySavedTheme() {
        var key = 'nvcApp.theme';
        var variables = {
          plum: '--plum', lavender: '--lavender', surface: '--surface-raised', ink: '--ink', inkSoft: '--ink-soft',
          rose: '--rose', mint: '--mint', gold: '--gold', peach: '--peach', sky: '--sky', outline: '--outline'
        };
        var hexPattern = /^#(?:[0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/;
        var root = document.documentElement;

        function parse(storage) {
          try {
            var raw = storage && storage.getItem(key);
            var value = raw ? JSON.parse(raw) : null;
            return value && typeof value === 'object' && !Array.isArray(value) ? value : null;
          } catch (error) { return null; }
        }

        function timestamp(value) {
          return value && typeof value.updatedAt === 'number' && Number.isFinite(value.updatedAt)
            ? value.updatedAt
            : 0;
        }

        function color(value) {
          if (typeof value !== 'string') return '';
          var prefixed = value.trim().charAt(0) === '#' ? value.trim() : '#' + value.trim();
          return hexPattern.test(prefixed) ? prefixed.toUpperCase() : '';
        }

        function stored(name) {
          try { return parse(window[name]); } catch (error) { return null; }
        }

        var local = stored('localStorage');
        var session = stored('sessionStorage');
        var theme = session && (!local || timestamp(session) > timestamp(local)) ? session : local;
        if (!theme || !theme.values || typeof theme.values !== 'object') return;

        var applied = false;
        Object.keys(variables).forEach(function (name) {
          var value = color(theme.values[name]);
          if (!value) return;
          root.style.setProperty(variables[name], value);
          applied = true;
        });
        var roundness = typeof theme.roundness === 'number' ? theme.roundness : Number(theme.roundness);
        if (Number.isFinite(roundness)) {
          root.style.setProperty('--corner-scale', String(Math.min(200, Math.max(0, Math.round(roundness))) / 100));
          applied = true;
        }
        var rose = color(theme.values.rose);
        var outline = color(theme.values.outline);
        var surface = color(theme.values.surface);
        var sky = color(theme.values.sky);
        if (rose) root.style.setProperty('--btn-bg', rose);
        if (outline) root.style.setProperty('--shadow', 'color-mix(in srgb, ' + outline + ' 55%, transparent)');
        if (surface && sky) root.style.setProperty('--chip-bg', 'color-mix(in srgb, ' + surface + ' 86%, ' + sky + ' 14%)');
        if (applied) root.setAttribute('data-theme-preapplied', 'true');
      })();
    </script>
    <style>
      .app-boot {
        width: min(34rem, calc(100vw - 2rem));
        margin: max(18vh, 5rem) auto 0;
        padding: 1.2rem;
        border: 3px solid var(--outline, #12081f);
        border-radius: calc(1.6rem * var(--corner-scale, 1));
        background: color-mix(in srgb, var(--lavender, #ede4ff) 22%, var(--surface-raised, #ffffff) 78%);
        box-shadow: 0 14px 0 color-mix(in srgb, var(--outline, #12081f) 28%, transparent);
        color: var(--ink, #12081f);
        font: 600 1rem/1.4 'Atkinson Hyperlegible', 'Segoe UI', sans-serif;
      }
      .app-boot strong {
        display: block;
        margin-bottom: 0.75rem;
        font: 700 1.1rem/1.2 Manrope, 'Segoe UI', sans-serif;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .app-boot__track {
        height: 0.65rem;
        overflow: hidden;
        border: 2px solid var(--outline, #12081f);
        border-radius: 999px;
        background: var(--lavender, #ece4ff);
      }
      .app-boot__bar {
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: var(--mint, #92dad3);
        animation: app-boot-progress 1.1s ease-in-out infinite alternate;
      }
      .app-boot__label {
        display: block;
        margin-top: 0.65rem;
        color: var(--ink-soft, #51445f);
        font-size: 0.85rem;
      }
      @keyframes app-boot-progress {
        from { transform: translateX(-18%); }
        to { transform: translateX(156%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-boot__bar { width: 100%; animation: none; }
      }
    </style>
    <title>allneeds.app</title>
  </head>
  <body>
    <div id="root">
      <div class="app-boot" role="status" aria-live="polite">
        <strong>allneeds.app</strong>
        <div class="app-boot__track" aria-hidden="true"><div class="app-boot__bar"></div></div>
        <span class="app-boot__label">Preparing the app for smooth navigation…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
