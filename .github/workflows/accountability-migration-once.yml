name: One-shot Accountability canonical migration

on:
  push:
    branches:
      - audit/accountability-approved
    paths:
      - '.github/workflows/accountability-migration-once.yml'

permissions:
  contents: write

concurrency:
  group: accountability-migration-once
  cancel-in-progress: false

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: audit/accountability-approved
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Apply deterministic migration
        run: node scripts/accountability-migration-once.mjs

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run foundation checks
        run: pnpm check
        env:
          VITE_BASE_PATH: /

      - name: Check patch hygiene
        run: git diff --check

      - name: Remove one-shot migration machinery
        run: rm scripts/accountability-migration-once.mjs .github/workflows/accountability-migration-once.yml

      - name: Commit validated migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "content: implement approved Accountability audit"
          git push origin HEAD:audit/accountability-approved
