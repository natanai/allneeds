name: One-shot Accountability A1 promotion

on:
  push:
    branches:
      - design/accountability-a1-production
    paths:
      - '.github/workflows/promote-accountability-a1-once.yml'

permissions:
  contents: write

concurrency:
  group: promote-accountability-a1-once
  cancel-in-progress: false

jobs:
  promote-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout promotion branch
        uses: actions/checkout@v6
        with:
          ref: design/accountability-a1-production
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Promote approved A1 identity
        run: node scripts/promote-accountability-a1-once.mjs

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run foundation checks
        run: pnpm check
        env:
          VITE_BASE_PATH: /

      - name: Check patch hygiene
        run: git diff --check

      - name: Remove one-shot promotion machinery
        run: rm scripts/promote-accountability-a1-once.mjs .github/workflows/promote-accountability-a1-once.yml

      - name: Commit validated promotion
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "design: promote Accountability Responsibility Mosaic"
          git push origin HEAD:design/accountability-a1-production
