name: Thin Words magnets release validation

on:
  workflow_dispatch:
  push:
    branches: [feat/thin-check-in-magnets]
    paths: [.github/workflows/batch1-validation.yml]

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: inline
            specs: tests/e2e/check-in-inline-intensity.spec.ts tests/e2e/alexithymia-support-desktop-word-layout.spec.ts
          - suite: enlarged
            specs: tests/e2e/check-in-clarity.spec.ts tests/e2e/check-in-selection-cues.spec.ts --grep 'doubling the base text size|Equal light faces, 320px|long mobile stages'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Build and check source
        run: ${{ matrix.suite == 'inline' && 'pnpm check' || 'pnpm build' }}
        env:
          VITE_BASE_PATH: /
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run Words regression checks
        run: pnpm exec playwright test --workers=1 ${{ matrix.specs }}
      - name: Run offline/reconnect verification
        if: ${{ always() && matrix.suite == 'inline' }}
        run: pnpm test:e2e:outage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chromium-words-${{ matrix.suite }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  mobile-webkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          VITE_BASE_PATH: /
      - run: pnpm exec playwright install --with-deps webkit
      - name: Verify strip geometry, the scroll area, and the footer
        run: |
          cat > playwright.thin-words.config.ts <<'EOF'
          import { defineConfig, devices } from '@playwright/test';
          import config from './playwright.config';
          export default defineConfig({
            ...config,
            projects: [{ name: 'mobile-webkit', use: { ...devices['iPhone 13'] } }],
          });
          EOF
          pnpm exec playwright test -c playwright.thin-words.config.ts tests/e2e/check-in-inline-intensity.spec.ts --grep 'at (320|390)px|other words stay out|mobile Words footer|dismissal hides|manual Maybe' --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webkit-words
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
