name: Feelings doorway stroke release verification

on:
  push:
    branches: [fix/feelings-doorway-match-stroke-weight]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run foundation checks
        run: pnpm check
        env:
          VITE_BASE_PATH: /

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify shared doorway line weights and navigation
        run: pnpm exec playwright test tests/e2e/check-in-magnet-and-map.spec.ts tests/e2e/magnet-nav-order.spec.ts --workers=1

      - name: Run offline/reconnect verification
        run: pnpm test:e2e:outage
