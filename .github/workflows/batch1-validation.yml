name: Compact Words release validation

on:
  workflow_dispatch:
  push:
    branches: [feat/compact-check-in-words]
    paths: [.github/workflows/batch1-validation.yml]

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: clarity
            specs: tests/e2e/check-in-clarity.spec.ts
          - suite: selection
            specs: tests/e2e/check-in-selection-cues.spec.ts
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Build and check source
        run: ${{ matrix.suite == 'inline' && 'pnpm check' || 'pnpm build' }}
        env:
          VITE_BASE_PATH: /
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run check-in browser regressions
        run: pnpm exec playwright test --workers=1 ${{ matrix.specs }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chromium-words-${{ matrix.suite }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

