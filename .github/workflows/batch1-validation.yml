name: Batch 3 outage verification

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - scripts/verify-offline-reconnect.mjs

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production shell
        run: pnpm build
        env:
          VITE_BASE_PATH: /

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run offline/reconnect verification
        run: pnpm test:e2e:outage
