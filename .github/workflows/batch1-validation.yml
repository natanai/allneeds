name: Check-In release focused validation

on:
  push:
    branches: [feat/check-in-magnet-shared-mood-map]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run foundation checks
        run: pnpm check
        env:
          VITE_BASE_PATH: /

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run core Check-In and account browser regressions
        run: pnpm exec playwright test tests/e2e/check-in-magnet-and-map.spec.ts tests/e2e/alexithymia-support.spec.ts tests/e2e/alexithymia-support-mobile-ux.spec.ts tests/e2e/journal-history.spec.ts tests/e2e/workflow-continuity.spec.ts tests/e2e/profile-reconciliation.spec.ts tests/e2e/magnet-nav-order.spec.ts --workers=1

      - name: Run offline/reconnect verification
        run: pnpm test:e2e:outage
