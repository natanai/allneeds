name: Full repository validation

on:
  workflow_dispatch:
  push:
    branches: [feat/check-in-magnet-intensity]
    paths: [.github/workflows/batch1-validation.yml]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run foundation checks
        run: pnpm check
        env:
          VITE_BASE_PATH: /

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run direct Feeling rating regression
        run: pnpm exec playwright test tests/e2e/check-in-inline-intensity.spec.ts --workers=1

      - name: Upload direct Feeling rating review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: direct-feeling-rating-review
          path: test-results/
          retention-days: 5

      - name: Run full browser regression suite serially
        run: pnpm exec playwright test tests/e2e/profile-reconciliation.spec.ts tests/e2e/workflow-continuity.spec.ts --workers=1

      - name: Recheck the mobile reference exit
        if: always()
        run: pnpm exec playwright test tests/e2e/check-in-clarity.spec.ts --grep 'explicit Observations exit.*320px' --workers=1

      - name: Upload complete browser review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-browser-review
          path: test-results/
          retention-days: 5

      - name: Run offline/reconnect verification
        if: always()
        run: pnpm test:e2e:outage
