name: Full repository validation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'fix/pickup-scale-position-drift'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run foundation checks
        run: pnpm check
        env:
          VITE_BASE_PATH: /

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run full browser regression suite serially
        run: pnpm exec playwright test --workers=1

      - name: Run offline/reconnect verification
        run: pnpm test:e2e:outage
