name: Full repository validation

on:
  push:
    branches: [site-test]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run foundation checks
        run: pnpm check
        env:
          VITE_BASE_PATH: /

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run full browser regression suite serially
        run: >-
          pnpm exec playwright test --workers=2
          tests/e2e/alexithymia-support.spec.ts
          tests/e2e/native-stability.spec.ts
          tests/e2e/nav-rendering-and-orientation.spec.ts
          tests/e2e/observation-inference.spec.ts
          tests/e2e/safety-strategies.spec.ts
          tests/e2e/shared-feed-mobile-layout.spec.ts
          tests/e2e/support-content.spec.ts
          tests/e2e/workflow-continuity.spec.ts

      - name: Run offline/reconnect verification
        run: pnpm test:e2e:outage
