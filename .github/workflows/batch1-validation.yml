name: Full repository validation

on:
  workflow_dispatch:
  push:
    branches: [codex/check-in-sheet-validation-2026-10-17]
    paths: ['.github/workflows/batch1-validation.yml']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run foundation checks
        run: pnpm check
        env:
          VITE_BASE_PATH: /

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run full browser regression suite serially
        run: pnpm exec playwright test --workers=1

      - name: Run offline/reconnect verification
        run: pnpm test:e2e:outage

      - name: Preserve synthetic browser test evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: check-in-sheet-browser-evidence
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
