name: Compact Words release validation

on:
  workflow_dispatch:
  push:
    branches: [feat/compact-check-in-words]
    paths: [.github/workflows/batch1-validation.yml]

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Build and check source
        run: ${{ matrix.shard == 1 && 'pnpm check' || 'pnpm build' }}
        env:
          VITE_BASE_PATH: /
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run browser regression shard
        run: pnpm exec playwright test --workers=1 --shard=${{ matrix.shard }}/4
      - name: Run offline/reconnect verification
        if: ${{ always() && matrix.shard == 1 }}
        run: pnpm test:e2e:outage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chromium-words-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  mobile-webkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          VITE_BASE_PATH: /
      - run: pnpm exec playwright install --with-deps webkit
      - name: Verify compact layout and touch selection in mobile WebKit
        run: |
          cat > playwright.compact-words.config.ts <<'EOF'
          import { defineConfig, devices } from '@playwright/test';
          import config from './playwright.config';
          export default defineConfig({
            ...config,
            projects: [{ name: 'mobile-webkit', use: { ...devices['iPhone 13'] } }],
          });
          EOF
          pnpm exec playwright test -c playwright.compact-words.config.ts tests/e2e/check-in-inline-intensity.spec.ts --grep 'at 390px|other words stay out' --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webkit-words
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
