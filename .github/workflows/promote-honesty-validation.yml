name: Promote approved Honesty magnet

on:
  push:
    branches:
      - design/promote-honesty-heart-to-honesty

permissions:
  contents: write

jobs:
  promote-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: design/promote-honesty-heart-to-honesty

      - name: Promote approved identity
        run: python scripts/promote_honesty.py

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repository checks
        run: pnpm check
        env:
          VITE_BASE_PATH: /

      - name: Verify promotion boundaries
        run: |
          test -f public/icons/needs/honesty.svg
          test -f public/icons/needs/art/honesty-corrected-destination.svg
          test -z "$(find public/design-lab/need-magnets -maxdepth 1 -name 'honesty-*.svg' -print -quit)"
          grep -q "needs-honesty" src/features/needs/NeedsPage.module.css
          grep -q "needMagnetAuditCandidates: readonly NeedMagnetAuditCandidate\[\] = \[\];" src/features/designLab/needMagnetAuditCandidates.ts
          grep -q "Honesty is fully audited" docs/honesty-content-audit.md

      - name: Commit promotion and remove temporary files
        run: |
          rm .github/workflows/promote-honesty-validation.yml scripts/promote_honesty.py
          git config user.name "natanai"
          git config user.email "109430106+natanai@users.noreply.github.com"
          git add -A
          git commit -m "design: promote approved Honesty magnet"
          git push origin HEAD:design/promote-honesty-heart-to-honesty
