name: One-shot held magnet root fix

on:
  push:
    branches:
      - fix/magnet-held-ring-and-scurry

permissions:
  contents: write

jobs:
  repair-validate-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v6
        with:
          ref: fix/magnet-held-ring-and-scurry
          fetch-depth: 0

      - name: Remove pointer focus ring at its source and strengthen scurry
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/magnets/MagnetBoard.tsx')
          text = path.read_text()

          old_constants = """const LIFTED_CLEARANCE = 38;\nconst LIFTED_CLEARING_ACCELERATION = 52;\nconst LIFTED_APPROACH_ACCELERATION = 70;\nconst LIFTED_NEIGHBOR_MAX_SPEED = 30;"""
          new_constants = """const LIFTED_CLEARANCE = 54;\nconst LIFTED_ESCAPE_BASE_SPEED = 96;\nconst LIFTED_ESCAPE_APPROACH_SPEED = 144;\nconst LIFTED_ESCAPE_ACCELERATION = 920;\nconst LIFTED_NEIGHBOR_MAX_SPEED = 220;"""
          if text.count(old_constants) != 1:
              raise SystemExit('Lifted-magnet constants no longer match expected current source')
          text = text.replace(old_constants, new_constants, 1)

          old_avoidance = """              if (scaledDistance < 1) {\n                const influence = (1 - scaledDistance) ** 2;\n                const approachSpeed = Math.max(\n                  (lifted.vx * clearX + lifted.vy * clearY) / clearDistance,\n                  0,\n                );\n                const approachBoost = clamp(approachSpeed / 420, 0, 1);\n                const escapeAcceleration = LIFTED_CLEARING_ACCELERATION\n                  + LIFTED_APPROACH_ACCELERATION * approachBoost;\n                resting.vx += (clearX / clearDistance) * escapeAcceleration * influence * step;\n                resting.vy += (clearY / clearDistance) * escapeAcceleration * influence * step;\n                kickWobble(resting, influence * (2.2 + approachBoost * 1.8) * step);\n              }"""
          new_avoidance = """              if (scaledDistance < 1) {\n                const influence = (1 - scaledDistance) ** 1.2;\n                const normalX = clearX / clearDistance;\n                const normalY = clearY / clearDistance;\n                const approachSpeed = Math.max(\n                  lifted.vx * normalX + lifted.vy * normalY,\n                  0,\n                );\n                const approachBoost = clamp(approachSpeed / 360, 0, 1);\n                const targetEscapeSpeed = (\n                  LIFTED_ESCAPE_BASE_SPEED\n                  + LIFTED_ESCAPE_APPROACH_SPEED * approachBoost\n                ) * influence;\n                const outwardSpeed = resting.vx * normalX + resting.vy * normalY;\n                const speedGain = clamp(\n                  targetEscapeSpeed - outwardSpeed,\n                  0,\n                  LIFTED_ESCAPE_ACCELERATION * step,\n                );\n                resting.vx += normalX * speedGain;\n                resting.vy += normalY * speedGain;\n                kickWobble(resting, influence * (7 + approachBoost * 7) * step);\n              }"""
          if text.count(old_avoidance) != 1:
              raise SystemExit('Lifted-magnet avoidance block no longer matches expected current source')
          text = text.replace(old_avoidance, new_avoidance, 1)

          old_focus = """    if (event.pointerType !== 'touch') {\n      event.currentTarget.focus({ preventScroll: true });\n    }\n    if (event.pointerType !== 'mouse' && event.cancelable) event.preventDefault();"""
          new_focus = """    // Pointer pickup is a direct-manipulation state, not keyboard focus.\n    // Clear any existing keyboard focus and suppress native pointer focusing so\n    // a held magnet never needs a CSS rule that merely hides a focus ring.\n    event.currentTarget.blur();\n    if (event.cancelable) event.preventDefault();"""
          if text.count(old_focus) != 1:
              raise SystemExit('Pointer-focus block no longer matches expected current source')
          text = text.replace(old_focus, new_focus, 1)
          path.write_text(text)
          PY

      - name: Remove obsolete held-focus CSS workaround
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/magnets/MagnetBoard.module.css')
          text = path.read_text()
          obsolete = """\n  .nav .magnet[data-picked-up='true']:focus-visible {\n    outline: none;\n  }\n"""
          if text.count(obsolete) != 1:
              raise SystemExit('Expected held-focus workaround not found exactly once')
          text = text.replace(obsolete, '\n', 1)
          if "data-picked-up='true']:focus-visible" in text:
              raise SystemExit('A held-magnet focus-hiding rule still remains')
          path.write_text(text)
          PY

      - name: Strengthen regression coverage for packed and mobile scurry
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/e2e/magnet-surface-interactions.spec.ts')
          text = path.read_text()
          text = text.replace(
              "expect(escapeDistance).toBeGreaterThan(4);\n  expect(distance(neighborDuring, neighborBefore)).toBeGreaterThan(4);",
              "expect(escapeDistance).toBeGreaterThan(14);\n  expect(distance(neighborDuring, neighborBefore)).toBeGreaterThan(14);",
              1,
          )
          addition = r'''

test('pointer pickup clears keyboard focus instead of covering its focus ring', async ({ page }) => {
  const { board, magnet } = await showOnlyAcceptance(page);
  await magnet.focus();
  await expect(magnet).toBeFocused();

  const box = await magnet.boundingBox();
  expect(box).not.toBeNull();
  await page.mouse.move(box!.x + box!.width / 2, box!.y + box!.height / 2);
  await page.mouse.down();
  await expect(magnet).toHaveAttribute('data-picked-up', 'true');
  await expect(magnet).not.toBeFocused();
  expect(await magnet.evaluate((element) => getComputedStyle(element).outlineStyle)).toBe('none');
  await page.mouse.up();
});

test.describe('mobile packed magnet scurry', () => {
  test.use({ viewport: { width: 390, height: 844 } });

  test('a touch-dragged magnet visibly clears a tightly packed neighbor', async ({ page }) => {
    await page.goto('/needs');
    const board = page.getByLabel('Needs magnet board');
    await expect(board).toHaveAttribute('data-ready', 'true');
    await ensurePhysicsOn(board);

    const dragged = board.getByRole('link', { name: 'Control', exact: true });
    const neighbor = board.getByRole('link', { name: 'Predictability', exact: true });
    await dragged.scrollIntoViewIfNeeded();
    await page.waitForTimeout(420);

    const draggedBefore = await magnetPosition(board, dragged);
    const neighborBefore = await magnetPosition(board, neighbor);
    const draggedBox = await dragged.boundingBox();
    const neighborBox = await neighbor.boundingBox();
    expect(draggedBox).not.toBeNull();
    expect(neighborBox).not.toBeNull();

    const draggedCenter = {
      x: draggedBox!.x + draggedBox!.width / 2,
      y: draggedBox!.y + draggedBox!.height / 2,
    };
    const neighborCenter = {
      x: neighborBox!.x + neighborBox!.width / 2,
      y: neighborBox!.y + neighborBox!.height / 2,
    };
    const separationX = neighborCenter.x - draggedCenter.x;
    const separationY = neighborCenter.y - draggedCenter.y;
    const separationLength = Math.max(Math.hypot(separationX, separationY), 1);
    const escapeX = separationX / separationLength;
    const escapeY = separationY / separationLength;
    const target = {
      x: neighborCenter.x - escapeX * 6,
      y: neighborCenter.y - escapeY * 6,
    };

    const session = await page.context().newCDPSession(page);
    try {
      await session.send('Input.dispatchTouchEvent', {
        type: 'touchStart',
        touchPoints: [{ x: draggedCenter.x, y: draggedCenter.y, id: 1 }],
      });
      for (let step = 1; step <= 14; step += 1) {
        const progress = step / 14;
        await session.send('Input.dispatchTouchEvent', {
          type: 'touchMove',
          touchPoints: [{
            x: draggedCenter.x + (target.x - draggedCenter.x) * progress,
            y: draggedCenter.y + (target.y - draggedCenter.y) * progress,
            id: 1,
          }],
        });
        await page.waitForTimeout(18);
      }
      await page.waitForTimeout(320);

      const draggedDuring = await magnetPosition(board, dragged);
      const neighborDuring = await magnetPosition(board, neighbor);
      const neighborDelta = {
        x: neighborDuring.x - neighborBefore.x,
        y: neighborDuring.y - neighborBefore.y,
      };
      const escapeDistance = neighborDelta.x * escapeX + neighborDelta.y * escapeY;

      expect(distance(draggedDuring, draggedBefore)).toBeGreaterThan(30);
      expect(escapeDistance).toBeGreaterThan(12);
      expect(distance(neighborDuring, neighborBefore)).toBeGreaterThan(12);
    } finally {
      await session.send('Input.dispatchTouchEvent', {
        type: 'touchEnd',
        touchPoints: [],
      }).catch(() => undefined);
      await session.detach();
    }
  });
});
'''
          if "pointer pickup clears keyboard focus" in text:
              raise SystemExit('New pickup/scurry regressions already exist')
          text += addition
          path.write_text(text)
          PY

      - name: Record superseding magnet interaction decision
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/design-language.md')
          text = path.read_text()
          old = """- Avoidance should begin slightly before hard overlap and become more responsive when the held magnet is moving toward another magnet.\n- Keep the response controlled rather than explosive: nearby magnets may scurry aside, but the held magnet remains attached to the pointer and avoidance must not cascade into a large chain reaction across the board.\n- Resting magnets remain speed-limited while another magnet is lifted so the board still feels viscous and deliberate rather than chaotic."""
          new = """- Avoidance should begin slightly before hard overlap and become more responsive when the held magnet is moving toward another magnet.\n- The dodge must remain plainly visible in the ordinary default packed layout on both desktop and touch devices. It must establish its own outward escape motion rather than depending on the resting collision/repulsion forces to create visible separation.\n- Keep the response controlled rather than explosive: nearby magnets may scurry aside, but the held magnet remains attached to the pointer and avoidance must not cascade into a large chain reaction across the board.\n- Resting magnets remain speed-limited while another magnet is lifted, but the lifted-state cap must be high enough for a nearby magnet to visibly clear the held magnet's path.\n- Pointer pickup is direct manipulation, not a focus treatment. A pointer-held magnet must not acquire an extra focus/selection ring; keyboard focus remains visibly indicated when navigating without pointer pickup. Do not implement this by hiding a held-state focus ring in CSS—prevent pointer pickup from creating/retaining that focus state at the interaction source."""
          if text.count(old) != 1:
              raise SystemExit('Magnet physics design-language block changed unexpectedly')
          text = text.replace(old, new, 1)

          old_decision = """- Held/dragged magnets now make nearby resting magnets visibly dodge away before overlap, with extra responsiveness when the held magnet is moving toward them, while preserving the existing viscous speed cap and all prior magnet interactions."""
          new_decision = """- Held/dragged magnets now establish a visibly stronger outward escape target for nearby magnets so the scurry reads clearly even in the default tightly packed layout on touch and desktop; pointer pickup also clears/suppresses pointer focus at the interaction source so no held-state focus-ring hiding workaround is needed."""
          if text.count(old_decision) != 1:
              raise SystemExit('Magnet decision-log entry changed unexpectedly')
          text = text.replace(old_decision, new_decision, 1)
          path.write_text(text)
          PY

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run foundation checks
        run: pnpm check
        env:
          VITE_BASE_PATH: /

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run magnet interaction regressions
        run: pnpm exec playwright test tests/e2e/magnet-surface-interactions.spec.ts tests/e2e/magnet-nav-order.spec.ts tests/e2e/nav-rendering-and-orientation.spec.ts --workers=1

      - name: Run offline/reconnect verification
        run: pnpm test:e2e:outage

      - name: Commit validated repair and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/magnets/MagnetBoard.tsx src/components/magnets/MagnetBoard.module.css tests/e2e/magnet-surface-interactions.spec.ts docs/design-language.md
          git rm .github/workflows/temp-magnet-held-ring-scurry.yml
          git commit -m 'Remove held focus ring and strengthen magnet scurry'
          git push origin HEAD:fix/magnet-held-ring-and-scurry
