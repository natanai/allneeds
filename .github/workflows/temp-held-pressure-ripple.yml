name: One-shot held pressure ripple

on:
  push:
    branches:
      - physics/held-pressure-ripple

permissions:
  contents: write

jobs:
  implement-validate-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout physics branch
        uses: actions/checkout@v6
        with:
          ref: physics/held-pressure-ripple
          fetch-depth: 0

      - name: Apply pressure propagation implementation
        run: python scripts/temp-held-pressure-ripple.py

      - name: Verify obsolete held-scurry code is gone
        run: |
          ! grep -R -n -E 'LIFTED_NEIGHBOR_MAX_SPEED|LIFTED_ESCAPE_BASE_SPEED|LIFTED_ESCAPE_APPROACH_SPEED|LIFTED_ESCAPE_ACCELERATION|hasLiftedMagnet' src/components/magnets
          ! grep -R -n "data-picked-up='true']:focus-visible" src/components/magnets

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run foundation checks
        run: pnpm check
        env:
          VITE_BASE_PATH: /

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run magnet physics regressions
        run: pnpm exec playwright test tests/e2e/magnet-surface-interactions.spec.ts tests/e2e/magnet-nav-order.spec.ts --workers=1

      - name: Run offline/reconnect verification
        run: pnpm test:e2e:outage

      - name: Commit validated physics change and remove temporary helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/magnets/MagnetBoard.tsx tests/e2e/magnet-surface-interactions.spec.ts docs/design-language.md
          git rm .github/workflows/temp-held-pressure-ripple.yml scripts/temp-held-pressure-ripple.py
          git commit -m 'Propagate held magnet pressure through the board'
          git push origin HEAD:physics/held-pressure-ripple
