name: One-shot magnet pickup position fix

on:
  push:
    branches:
      - fix/pickup-scale-position-drift

permissions:
  contents: write

jobs:
  patch-validate-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v6
        with:
          ref: fix/pickup-scale-position-drift
          fetch-depth: 0

      - name: Repair pickup transform composition
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/magnets/MagnetBoard.module.css')
          text = path.read_text()

          replacements = [
              (
                  "  --magnet-rock: 0deg;\n",
                  "  --magnet-rock: 0deg;\n  --magnet-scale: 1;\n",
              ),
              (
                  "  translate: 0 var(--magnet-lift);\n  scale: 1;\n  transform:\n    translate3d(var(--magnet-x), var(--magnet-y), 0)\n    translateY(var(--magnet-wobble-y))\n    rotate(calc(var(--magnet-tilt) + var(--magnet-rock)));\n",
                  "  translate: 0 var(--magnet-lift);\n  transform:\n    translate3d(var(--magnet-x), var(--magnet-y), 0)\n    translateY(var(--magnet-wobble-y))\n    rotate(calc(var(--magnet-tilt) + var(--magnet-rock)))\n    scale(var(--magnet-scale));\n",
              ),
              (
                  "  transition: transform 180ms ease, translate 180ms ease, scale 160ms ease, box-shadow 180ms ease, filter 180ms ease;\n",
                  "  transition: transform 180ms ease, translate 180ms ease, box-shadow 180ms ease, filter 180ms ease;\n",
              ),
              (
                  "  transition: translate 180ms ease, scale 160ms ease, box-shadow 180ms ease, filter 180ms ease;\n",
                  "  transition: translate 180ms ease, box-shadow 180ms ease, filter 180ms ease;\n",
              ),
              (
                  "  --magnet-lift: -12px;\n  z-index: 20;\n  scale: 1.065;\n",
                  "  --magnet-lift: -12px;\n  --magnet-scale: 1.065;\n  z-index: 20;\n",
              ),
              (
                  "    translate: 0 0;\n    scale: 1;\n    transform: none;\n",
                  "    translate: 0 0;\n    transform: none;\n",
              ),
              (
                  "  .nav .magnet[data-picked-up='true'] {\n    --magnet-lift: 0px;\n    scale: 1;\n",
                  "  .nav .magnet[data-picked-up='true'] {\n    --magnet-lift: 0px;\n    --magnet-scale: 1;\n",
              ),
              (
                  "    translate: 0 0;\n    scale: 1.01;\n    transform:\n      translate3d(var(--magnet-x), var(--magnet-y), 0)\n      translateY(-3px)\n      rotate(var(--magnet-rock));\n",
                  "    translate: 0 0;\n    transform:\n      translate3d(var(--magnet-x), var(--magnet-y), 0)\n      translateY(-3px)\n      rotate(var(--magnet-rock))\n      scale(1.01);\n",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one CSS source match, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          if "scale: 1.065" in text:
              raise SystemExit('Pickup still uses the individual scale property')

          path.write_text(text)
          PY

      - name: Add rendered pickup-position regression
        run: |
          cat >> tests/e2e/magnet-surface-interactions.spec.ts <<'EOF'

          test.describe('mobile deep-scroll pickup geometry', () => {
            test.use({ viewport: { width: 390, height: 844 } });

            test('picking up Predictability does not scale its board translation', async ({ page }) => {
              await page.goto('/needs');
              const board = page.getByLabel('Needs magnet board');
              await expect(board).toHaveAttribute('data-ready', 'true');
              await ensurePhysicsOn(board);
              const magnet = board.getByRole('link', { name: 'Predictability', exact: true });
              await magnet.scrollIntoViewIfNeeded();
              await page.waitForTimeout(500);

              const scrollBefore = await page.evaluate(() => window.scrollY);
              expect(scrollBefore).toBeGreaterThan(300);
              const positionBefore = await magnetPosition(board, magnet);
              const boxBefore = await magnet.boundingBox();
              expect(boxBefore).not.toBeNull();

              const startX = boxBefore!.x + boxBefore!.width / 2;
              const startY = boxBefore!.y + boxBefore!.height / 2;
              const session = await page.context().newCDPSession(page);
              try {
                await session.send('Input.dispatchTouchEvent', {
                  type: 'touchStart',
                  touchPoints: [{ x: startX, y: startY, id: 1 }],
                });
                await expect(magnet).toHaveAttribute('data-picked-up', 'true');
                await page.waitForTimeout(220);

                const positionAfter = await magnetPosition(board, magnet);
                const boxAfter = await magnet.boundingBox();
                expect(boxAfter).not.toBeNull();
                expect(distance(positionAfter, positionBefore)).toBeLessThanOrEqual(1);

                const centerBefore = {
                  x: boxBefore!.x + boxBefore!.width / 2,
                  y: boxBefore!.y + boxBefore!.height / 2,
                };
                const centerAfter = {
                  x: boxAfter!.x + boxAfter!.width / 2,
                  y: boxAfter!.y + boxAfter!.height / 2,
                };
                expect(Math.abs(centerAfter.x - centerBefore.x)).toBeLessThanOrEqual(3);
                expect(centerAfter.y - centerBefore.y).toBeGreaterThanOrEqual(-18);
                expect(centerAfter.y - centerBefore.y).toBeLessThanOrEqual(2);
                expect(boxAfter!.width).toBeGreaterThan(boxBefore!.width * 1.04);
                expect(Math.abs((await page.evaluate(() => window.scrollY)) - scrollBefore)).toBeLessThanOrEqual(1);
              } finally {
                await session.send('Input.dispatchTouchEvent', {
                  type: 'touchEnd',
                  touchPoints: [],
                }).catch(() => undefined);
                await session.detach();
              }
            });
          });
          EOF

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run foundation checks
        run: pnpm check
        env:
          VITE_BASE_PATH: /

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run full browser regression suite serially
        run: pnpm exec playwright test --workers=1

      - name: Run offline/reconnect verification
        run: pnpm test:e2e:outage

      - name: Commit validated repair and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/magnets/MagnetBoard.module.css tests/e2e/magnet-surface-interactions.spec.ts
          git rm .github/workflows/temp-pickup-scale-fix.yml
          git commit -m 'Fix deep-board magnet pickup position drift'
          git push origin HEAD:fix/pickup-scale-position-drift
