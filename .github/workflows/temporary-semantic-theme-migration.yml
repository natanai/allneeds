name: Temporary semantic theme migration

on:
  push:
    branches:
      - refactor/semantic-theme-roles

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: refactor/semantic-theme-roles
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Migrate semantic theme roles
        run: node scripts/semantic-theme-role-migration.mjs

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks before committing migration
        run: pnpm check

      - name: Commit migrated source and documentation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No migration changes remained."
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src AGENTS.md docs/design-language.md
          git commit -m "Complete semantic theme role documentation [skip ci]"
          git push origin HEAD:refactor/semantic-theme-roles
