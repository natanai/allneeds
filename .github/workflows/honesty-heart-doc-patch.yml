name: Honesty heart lab validation

on:
  push:
    branches: [design/honesty-heart-language]
    paths:
      - '.github/workflows/honesty-heart-doc-patch.yml'

permissions:
  contents: write

jobs:
  validate-and-record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: design/honesty-heart-language

      - name: Record Need icon identity rule
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/design-language.md')
          text = path.read_text()
          needle = '- Full-face art should use Customizer-owned functional roles and remain legible across every real preset, including near-monochrome Refrigerator. Do not hard-code rescue colors for one design.\n'
          addition = (
              '- Primary Need icons should remain visually distinct across the site. Before proposing a new Need identity, compare its primary glyph with the full existing Need-icon inventory and approved identities. Do not reuse another Need’s primary glyph as the main symbol. A familiar motif may appear only as a subtle secondary echo when relatedness is intentional, unless the user explicitly approves stronger reuse.\n'
              '- Multiple visible icons on one Need magnet require an approved conceptual reason, such as distinct function lenses. A unified Need without lenses should default to one primary icon, with additional meaning carried by full-face artwork rather than extra glyphs.\n'
          )
          if addition in text:
              raise SystemExit('icon identity rule already present')
          if needle not in text:
              raise SystemExit('design-language insertion point not found')
          path.write_text(text.replace(needle, needle + addition, 1))
          PY

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repository checks
        run: pnpm check

      - name: Commit documentation and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/honesty-heart-doc-patch.yml
          git add docs/design-language.md
          git commit -m "docs: require distinct primary Need magnet icons"
          git push
