name: Honesty editorial formatting cleanup

on:
  push:
    branches:
      - audit/honesty-canonical

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v6
        with:
          ref: audit/honesty-canonical
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Normalize catalog formatting without semantic changes
        run: python scripts/normalize-honesty-editorial.py

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Re-run repository checks
        run: pnpm check
        env:
          VITE_BASE_PATH: /

      - name: Commit cleanup and remove temporary files
        shell: bash
        run: |
          rm .github/workflows/honesty-editorial-format-cleanup.yml scripts/normalize-honesty-editorial.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: minimize Honesty catalog diff"
          git push origin HEAD:audit/honesty-canonical
