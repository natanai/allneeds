name: Honesty canonical Need ordering fix

on:
  push:
    branches:
      - audit/honesty-canonical

permissions:
  contents: write

jobs:
  fix-order:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v6
        with:
          ref: audit/honesty-canonical
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Apply canonical Need ordering fix
        run: python scripts/fix-canonical-need-order.py

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repository checks
        run: pnpm check
        env:
          VITE_BASE_PATH: /

      - name: Commit fix and remove temporary files
        shell: bash
        run: |
          rm .github/workflows/honesty-canonical-order-fix.yml scripts/fix-canonical-need-order.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve canonical Need ordering"
          git push origin HEAD:audit/honesty-canonical
