name: Upload user submitted strategies

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upload-user-submitted-strategies
  cancel-in-progress: false

jobs:
  import:
    name: Validate, publish, and clean inbox
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Import submitted strategies
        run: node scripts/import-user-submitted-strategies.mjs

      - name: Commit published strategies and inbox cleanup
        shell: bash
        run: |
          if git diff --quiet -- data/user-submitted-strategies.json data/user-strategy-uploads; then
            echo "No repository changes were needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/user-submitted-strategies.json data/user-strategy-uploads
          git commit -m "Publish user submitted strategies"
          git push origin HEAD:main
