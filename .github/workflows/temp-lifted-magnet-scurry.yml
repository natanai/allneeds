name: One-shot lifted magnet scurry tuning

on:
  push:
    branches:
      - tune/lifted-magnet-scurry

permissions:
  contents: write

jobs:
  tune-validate-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tuning branch
        uses: actions/checkout@v6
        with:
          ref: tune/lifted-magnet-scurry
          fetch-depth: 0

      - name: Tune lifted-magnet avoidance
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/magnets/MagnetBoard.tsx')
          text = path.read_text()

          old_constants = """const LIFTED_CLEARANCE = 22;\nconst LIFTED_CLEARING_ACCELERATION = 16;\nconst LIFTED_NEIGHBOR_MAX_SPEED = 7;"""
          new_constants = """const LIFTED_CLEARANCE = 34;\nconst LIFTED_CLEARING_ACCELERATION = 42;\nconst LIFTED_APPROACH_ACCELERATION = 46;\nconst LIFTED_NEIGHBOR_MAX_SPEED = 24;"""
          if text.count(old_constants) != 1:
              raise SystemExit('Lifted-magnet constants no longer match expected main source')
          text = text.replace(old_constants, new_constants, 1)

          old_avoidance = """              if (scaledDistance < 1) {\n                const influence = (1 - scaledDistance) ** 2;\n                resting.vx += (clearX / clearDistance) * LIFTED_CLEARING_ACCELERATION * influence * step;\n                resting.vy += (clearY / clearDistance) * LIFTED_CLEARING_ACCELERATION * influence * step;\n                kickWobble(resting, influence * 2.2 * step);\n              }"""
          new_avoidance = """              if (scaledDistance < 1) {\n                const influence = (1 - scaledDistance) ** 2;\n                const approachSpeed = Math.max(\n                  (lifted.vx * clearX + lifted.vy * clearY) / clearDistance,\n                  0,\n                );\n                const approachBoost = clamp(approachSpeed / 420, 0, 1);\n                const escapeAcceleration = LIFTED_CLEARING_ACCELERATION\n                  + LIFTED_APPROACH_ACCELERATION * approachBoost;\n                resting.vx += (clearX / clearDistance) * escapeAcceleration * influence * step;\n                resting.vy += (clearY / clearDistance) * escapeAcceleration * influence * step;\n                kickWobble(resting, influence * (2.2 + approachBoost * 1.8) * step);\n              }"""
          if text.count(old_avoidance) != 1:
              raise SystemExit('Lifted-magnet avoidance block no longer matches expected main source')
          text = text.replace(old_avoidance, new_avoidance, 1)
          path.write_text(text)
          PY

      - name: Add lifted-magnet reactivity regression
        run: |
          cat >> tests/e2e/magnet-surface-interactions.spec.ts <<'EOF'

          test('a dragged magnet makes a nearby resting magnet dodge out of its path', async ({ page }) => {
            await page.goto('/needs');
            const board = page.getByLabel('Needs magnet board');
            await expect(board).toHaveAttribute('data-ready', 'true');
            await ensurePhysicsOn(board);

            const dragged = board.getByRole('link', { name: 'Control', exact: true });
            const neighbor = board.getByRole('link', { name: 'Predictability', exact: true });
            await dragged.scrollIntoViewIfNeeded();
            await expect(neighbor).toBeVisible();
            await page.waitForTimeout(420);

            const draggedBefore = await magnetPosition(board, dragged);
            const neighborBefore = await magnetPosition(board, neighbor);
            const draggedBox = await dragged.boundingBox();
            const neighborBox = await neighbor.boundingBox();
            expect(draggedBox).not.toBeNull();
            expect(neighborBox).not.toBeNull();

            const draggedCenter = {
              x: draggedBox!.x + draggedBox!.width / 2,
              y: draggedBox!.y + draggedBox!.height / 2,
            };
            const neighborCenter = {
              x: neighborBox!.x + neighborBox!.width / 2,
              y: neighborBox!.y + neighborBox!.height / 2,
            };
            const separationX = neighborCenter.x - draggedCenter.x;
            const separationY = neighborCenter.y - draggedCenter.y;
            const separationLength = Math.max(Math.hypot(separationX, separationY), 1);
            const escapeX = separationX / separationLength;
            const escapeY = separationY / separationLength;
            const target = {
              x: neighborCenter.x - escapeX * 14,
              y: neighborCenter.y - escapeY * 14,
            };

            await page.mouse.move(draggedCenter.x, draggedCenter.y);
            await page.mouse.down();
            for (let step = 1; step <= 14; step += 1) {
              const progress = step / 14;
              await page.mouse.move(
                draggedCenter.x + (target.x - draggedCenter.x) * progress,
                draggedCenter.y + (target.y - draggedCenter.y) * progress,
              );
              await page.waitForTimeout(18);
            }
            await page.waitForTimeout(260);

            const draggedDuring = await magnetPosition(board, dragged);
            const neighborDuring = await magnetPosition(board, neighbor);
            const neighborDelta = {
              x: neighborDuring.x - neighborBefore.x,
              y: neighborDuring.y - neighborBefore.y,
            };
            const escapeDistance = neighborDelta.x * escapeX + neighborDelta.y * escapeY;

            expect(distance(draggedDuring, draggedBefore)).toBeGreaterThan(30);
            expect(escapeDistance).toBeGreaterThan(4);
            expect(distance(neighborDuring, neighborBefore)).toBeGreaterThan(4);
            await page.mouse.up();
          });
          EOF

      - name: Record accepted magnet interaction language
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/design-language.md')
          text = path.read_text()
          anchor = """## Touch and control sizing\n"""
          section = """## Magnet physics\n\n**Accepted 2026-08-25.** A magnet being actively held should make nearby resting magnets visibly yield and dodge away as it passes over them, creating a restrained \"scurry out from under it\" response.\n\n- This is an enhancement to the existing physics, not a replacement: preserve pickup alignment, direct drag tracking, fling/release behavior, collisions, wobble, empty-space pushing, persistence, and Play/rest semantics.\n- Avoidance should begin slightly before hard overlap and become more responsive when the held magnet is moving toward another magnet.\n- Keep the response controlled rather than explosive: nearby magnets may scurry aside, but the held magnet remains attached to the pointer and avoidance must not cascade into a large chain reaction across the board.\n- Resting magnets remain speed-limited while another magnet is lifted so the board still feels viscous and deliberate rather than chaotic.\n\n"""
          if section in text:
              raise SystemExit('Magnet physics decision already recorded')
          if text.count(anchor) != 1:
              raise SystemExit('Design-language insertion anchor changed')
          text = text.replace(anchor, section + anchor, 1)

          decision_anchor = """## Decision log\n\n"""
          decision = """### 2026-08-25\n\n- Held/dragged magnets now make nearby resting magnets visibly dodge away before overlap, with extra responsiveness when the held magnet is moving toward them, while preserving the existing viscous speed cap and all prior magnet interactions.\n\n"""
          if text.count(decision_anchor) != 1:
              raise SystemExit('Decision-log anchor changed')
          text = text.replace(decision_anchor, decision_anchor + decision, 1)
          path.write_text(text)
          PY

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run foundation checks
        run: pnpm check
        env:
          VITE_BASE_PATH: /

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run full browser regression suite serially
        run: pnpm exec playwright test --workers=1

      - name: Run offline/reconnect verification
        run: pnpm test:e2e:outage

      - name: Commit validated tuning and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/magnets/MagnetBoard.tsx tests/e2e/magnet-surface-interactions.spec.ts docs/design-language.md
          git rm .github/workflows/temp-lifted-magnet-scurry.yml
          git commit -m 'Make nearby magnets dodge lifted drags'
          git push origin HEAD:tune/lifted-magnet-scurry
